name: lensescan
description: LenseScan - Secure Legal Metrology Compliance Checking System for LMPC Rules 2011.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP Client with interceptors
  dio: ^5.7.0

  # Secure encrypted storage for JWT tokens
  flutter_secure_storage: ^9.2.2

  # State management
  provider: ^6.1.2

  # Declarative routing with auth guards
  go_router: ^14.3.0

  # Camera access
  camera: ^0.11.0+2

  # Image picker (gallery fallback)
  image_picker: ^1.1.2

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # Google Fonts for premium typography
  google_fonts: ^6.2.1
  camera_web: ^0.3.5+6
  fl_chart: 0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # IBM Plex Sans (SIL Open Font License), bundled so every weight is the real cut, not a faux bold.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700

